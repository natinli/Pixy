<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Pixy icon concepts v1</title>
  <desc id="desc">Four original vector directions for a macOS-style Pixy app icon.</desc>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9fb"/>
      <stop offset="1" stop-color="#eceef2"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183e78"/>
      <stop offset="0.55" stop-color="#102a5b"/>
      <stop offset="1" stop-color="#071a3e"/>
    </linearGradient>
    <linearGradient id="blueGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#5c9ef0" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#2856c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#755ff2"/>
      <stop offset="0.55" stop-color="#5140c8"/>
      <stop offset="1" stop-color="#2e258b"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9ef"/>
      <stop offset="1" stop-color="#f0dfc2"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72e6e5"/>
      <stop offset="0.48" stop-color="#5a8cf0"/>
      <stop offset="1" stop-color="#a26ce9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14264a" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102244" flood-opacity="0.22"/>
    </filter>
    <clipPath id="clipA"><rect x="80" y="210" width="320" height="320" rx="76"/></clipPath>
    <clipPath id="clipB"><rect x="460" y="210" width="320" height="320" rx="76"/></clipPath>
    <clipPath id="clipC"><rect x="840" y="210" width="320" height="320" rx="76"/></clipPath>
    <clipPath id="clipD"><rect x="1220" y="210" width="320" height="320" rx="76"/></clipPath>
  </defs>

  <rect width="1600" height="1200" fill="url(#board)"/>
  <text x="80" y="94" fill="#1c2740" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="600" letter-spacing="0.5">Pixy · icon directions</text>
  <text x="80" y="132" fill="#738096" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Original vector explorations — macOS-native restraint, image-viewing semantics</text>

  <!-- A: Folded image aperture -->
  <g filter="url(#softShadow)">
    <rect x="80" y="210" width="320" height="320" rx="76" fill="url(#navy)"/>
    <g clip-path="url(#clipA)">
      <path d="M116 398 L232 282 L350 398 L350 514 L116 514 Z" fill="#4e91e5" fill-opacity="0.98"/>
      <path d="M232 282 L350 398 L350 514 L232 398 Z" fill="#97d9f1" fill-opacity="0.55"/>
      <path d="M232 282 L350 398 L232 398 L150 316 Z" fill="#d6f5ff" fill-opacity="0.76"/>
      <path d="M232 282 L232 398 L150 316 Z" fill="#6f82e9" fill-opacity="0.42"/>
    </g>
    <path d="M146 405 L232 319 L318 405" fill="none" stroke="#f2fbff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>
  </g>

  <!-- B: Quiet lens / viewing aperture -->
  <g filter="url(#softShadow)">
    <rect x="460" y="210" width="320" height="320" rx="76" fill="#dbe8f5"/>
    <g clip-path="url(#clipB)">
      <rect x="460" y="210" width="320" height="320" fill="url(#blueGlass)" opacity="0.45"/>
      <circle cx="620" cy="370" r="105" fill="#173260" fill-opacity="0.95" filter="url(#smallShadow)"/>
      <circle cx="620" cy="370" r="84" fill="#0a1e46"/>
      <path d="M562 398 C584 350 614 327 649 326 C682 325 701 342 716 365 C694 413 661 438 622 439 C594 439 575 425 562 398 Z" fill="url(#spectrum)" opacity="0.98"/>
      <circle cx="620" cy="370" r="28" fill="#eaf7ff" fill-opacity="0.86"/>
      <circle cx="620" cy="370" r="13" fill="#ffffff"/>
      <path d="M560 302 C581 281 609 269 638 267" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
    </g>
  </g>

  <!-- C: Continuous image ribbon -->
  <g filter="url(#softShadow)" transform="translate(-760 480)">
    <rect x="840" y="210" width="320" height="320" rx="76" fill="url(#violet)"/>
    <g clip-path="url(#clipC)">
      <path d="M905 336 C905 297 937 269 977 269 L1092 269 C1114 269 1130 287 1130 309 C1130 331 1114 349 1092 349 L1004 349 L1004 389 L1081 389 C1103 389 1120 407 1120 429 C1120 451 1103 469 1081 469 L965 469 C932 469 905 442 905 409 Z" fill="url(#spectrum)"/>
      <path d="M1004 349 L1081 349 C1103 349 1120 367 1120 389 C1120 411 1103 429 1081 429 L1004 429 Z" fill="#273eae" opacity="0.72"/>
      <path d="M951 292 L1092 292 C1102 292 1110 300 1110 310 C1110 320 1102 328 1092 328 L982 328 Z" fill="#ffffff" opacity="0.22"/>
    </g>
  </g>

  <!-- D: Layered image planes -->
  <g filter="url(#softShadow)" transform="translate(-760 480)">
    <rect x="1220" y="210" width="320" height="320" rx="76" fill="url(#warm)"/>
    <g clip-path="url(#clipD)">
      <path d="M1289 311 Q1289 280 1320 280 L1457 280 Q1488 280 1488 311 L1488 419 Q1488 450 1457 450 L1320 450 Q1289 450 1289 419 Z" fill="#ffffff" fill-opacity="0.84" filter="url(#smallShadow)"/>
      <path d="M1289 311 L1392 383 L1488 311 L1488 419 Q1488 450 1457 450 L1320 450 Q1289 450 1289 419 Z" fill="#2859bd" opacity="0.94"/>
      <path d="M1289 311 L1392 383 L1488 311" fill="none" stroke="#f7fbff" stroke-width="5" opacity="0.9"/>
      <path d="M1260 366 L1355 284 L1434 347 L1340 429 Z" fill="#5f80e0" opacity="0.42"/>
      <circle cx="1439" cy="329" r="14" fill="#e8c77c"/>
    </g>
  </g>

  <g fill="#69758a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" letter-spacing="0.3">
    <text x="80" y="590">A · folded aperture</text>
    <text x="460" y="590">B · quiet lens</text>
    <text x="80" y="1070">C · image ribbon</text>
    <text x="460" y="1070">D · layered frame</text>
  </g>
  <text x="80" y="1150" fill="#9aa4b3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Concept board only · artwork is vector and intentionally not connected to the app yet</text>
</svg>
