<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pixy image and sparkle icon</title>
  <desc id="desc">A square macOS icon master with a cartoon image card and a sparkle.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9c8ff"/>
      <stop offset="1" stop-color="#aaaeea"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e7fa"/>
      <stop offset="1" stop-color="#8bc8ed"/>
    </linearGradient>
    <linearGradient id="frontHill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76dcb1"/>
      <stop offset="1" stop-color="#56c79d"/>
    </linearGradient>
    <linearGradient id="backHill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ed4b8"/>
      <stop offset="1" stop-color="#67b79b"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#5c4e83" flood-opacity="0.25"/>
    </filter>
    <filter id="starShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#5c4e83" flood-opacity="0.28"/>
    </filter>
    <clipPath id="imageWindow">
      <rect x="151" y="343" width="722" height="344" rx="34"/>
    </clipPath>
  </defs>

  <!-- Full-bleed square master; the system applies its own macOS mask. -->
  <rect width="1024" height="1024" fill="url(#background)"/>

  <!-- Main image card. -->
  <g filter="url(#cardShadow)">
    <rect x="112" y="302" width="800" height="430" rx="72" fill="#fffdfc" stroke="#74428d" stroke-width="18"/>
    <rect x="151" y="343" width="722" height="344" rx="34" fill="url(#sky)" stroke="#74428d" stroke-width="14"/>
    <g clip-path="url(#imageWindow)">
      <rect x="151" y="343" width="722" height="344" fill="url(#sky)"/>
      <circle cx="278" cy="443" r="50" fill="#ffe29a"/>
      <path d="M151 625 C226 548 284 530 347 588 C409 646 480 534 549 516 C633 494 700 580 761 545 C807 519 844 534 873 565 L873 687 L151 687 Z" fill="url(#backHill)" stroke="#74428d" stroke-width="13" stroke-linejoin="round"/>
      <path d="M151 660 C236 607 284 592 352 630 C434 676 494 580 574 576 C661 572 716 639 785 616 C824 603 851 614 873 633 L873 687 L151 687 Z" fill="url(#frontHill)" stroke="#74428d" stroke-width="13" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Single defining Pixy sparkle, overlapping the upper-right of the image card. -->
  <g filter="url(#starShadow)" transform="translate(0 90)">
    <path d="M788 178 C800 168 810 151 817 125 C824 151 834 168 846 178 C857 188 875 197 901 204 C875 211 857 220 846 230 C834 240 824 257 817 283 C810 257 800 240 788 230 C777 220 759 211 733 204 C759 197 777 188 788 178 Z" fill="#ffe48b" stroke="#74428d" stroke-width="16" stroke-linejoin="round"/>
    <path d="M817 151 L817 256 M764 204 L870 204" stroke="#fff6c7" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
